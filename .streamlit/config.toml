[theme]
# Neutral palette from the "Chat with inline citations" design (light only).
base = "light"
primaryColor = "#0A0A0A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
textColor = "#0A0A0A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 100

[browser]
gatherUsageStats = false
